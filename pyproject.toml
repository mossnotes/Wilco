[project]
name = "wilco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "browser-use>=0.13.9",
    "cryptography>=43.0.0",
    "fastapi>=0.148.0",
    "google-genai>=1.65.0",
    "jinja2>=3.1.5",
    "phonenumbers>=9.0.0",
    "playwright>=1.64.0",
    "pydantic-settings>=2.16.0",
    "pyotp>=2.9.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
