{% extends "layout.html" %}
{% from "site_icon.html" import site_icon %}

{% block content %}
<section>
    <a class="back-link" href="/vault/accounts">← {{ ui.accounts }}</a>
    <div class="site-heading">
        {{ site_icon(target_domain) }}
        <div class="site-heading-text">
            <p class="site-domain">{{ target_domain }}</p>
            <h1>{{ ui.account_details }}</h1>
        </div>
    </div>
    <dl id="account-details" class="account-details" data-target-domain="{{ target_domain }}"></dl>
    <div class="actions account-delete-action">
        <button class="button button-secondary" type="button" id="delete-account">{{ ui.delete }}</button>
    </div>
</section>
<dialog id="remove-modal" aria-labelledby="remove-title">
    <h2 id="remove-title">{{ ui.delete_account }}</h2>
    <p class="dialog-domain">{{ target_domain }}</p>
    <p class="delete-notice">{{ ui.delete_account_notice }}</p>
    <form id="remove-form" class="form-stack">
        <p class="feedback" role="alert" hidden></p>
        <div class="actions"><button class="button button-secondary" type="button" data-close-dialog>{{ ui.cancel }}</button><button class="button" type="submit">{{ ui.delete }}</button></div>
    </form>
</dialog>
{% endblock %}
