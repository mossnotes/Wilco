<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ ui.app_name }}</title>
    <link rel="preload" href="{{ url_for('companion-static', path='fonts/gowun-batang-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('companion-static', path='companion.css') }}">
    <script id="telegram-sdk" src="https://telegram.org/js/telegram-web-app.js" async></script>
    <script src="{{ url_for('companion-static', path='companion.js') }}" defer></script>
</head>
<body class="auth-pending" data-auth-user="{{ user.id if user is defined and user else '' }}">
    <div class="shell">
        <header class="app-header"><a class="wordmark" href="/companion/accounts">{{ ui.app_name }}</a></header>
        <p id="auth-status" class="auth-status" role="status">{{ ui.connecting }}</p>
        <main>{% block content %}{% endblock %}</main>
    </div>
    <script id="ui-copy" type="application/json">{{ ui | tojson }}</script>
</body>
</html>
