{% extends "layout.html" %}

{% block content %}
<section>
    <div class="page-heading"><h1>{{ ui.input_needed }}</h1></div>
    <form id="resolve-form" class="form-stack" novalidate
          data-task-id="{{ task.task_id }}"
          data-target-domain="{{ target_domain | default('', true) }}"
          data-deadline="{{ task.metadata.get('credential_input_deadline') or '' }}">
        {% if target_domain %}
        <p class="request-domain">{{ target_domain }}</p>
        <div class="field">
            <label for="username">{{ ui.username_or_email }}</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="320">
        </div>
        <div class="field">
            <label for="password">{{ ui.password }}</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="field">
            <label for="totp_seed">{{ ui.authenticator_key_optional }}</label>
            <input id="totp_seed" name="totp_seed" type="password" autocomplete="off" spellcheck="false" maxlength="1024">
        </div>
        <p id="input-countdown" class="countdown" role="timer" hidden></p>
        {% else %}
        <div class="field">
            <label for="user_input">{{ ui.response }}</label>
            <textarea id="user_input" name="user_input" rows="3"></textarea>
        </div>
        {% endif %}
        <p id="resolve-error" class="feedback" role="alert" hidden></p>
        <div class="actions">
            <button class="button button-secondary" id="cancel-task" type="button">{{ ui.cancel_task }}</button>
            <button class="button" type="submit" id="submit-btn">{{ ui.resume }}</button>
        </div>
    </form>
</section>

<dialog id="cancel-modal" aria-labelledby="cancel-title">
    <h2 id="cancel-title">{{ ui.cancel_task_question }}</h2>
    <form id="cancel-form" class="form-stack">
        <p id="cancel-error" class="feedback" role="alert" hidden></p>
        <div class="actions">
            <button class="button button-secondary" type="button" data-close-dialog>{{ ui.close }}</button>
            <button class="button" type="submit">{{ ui.cancel_task }}</button>
        </div>
    </form>
</dialog>
{% endblock %}
