{% extends "layout.html" %}
{% from "site_icon.html" import site_icon %}

{% block content %}
<section>
    <div class="site-heading">
        {{ site_icon(target_domain) }}
        <div class="site-heading-text"><p class="site-domain">{{ target_domain }}</p><h1>{{ secret_label }}</h1></div>
    </div>
    <form id="resolve-form" class="form-stack" novalidate
          data-task-id="{{ task.task_id }}"
          data-target-domain="{{ target_domain }}"
          data-credential-type="{{ credential_type }}">
        <div class="field">
            <label for="secret">{{ secret_label }}</label>
            <div class="secret-field">
                <input id="secret" name="secret" type="password" required maxlength="16384"
                       autocomplete="{{ 'current-password' if credential_type == 'password' else 'off' }}"
                       autocapitalize="none" spellcheck="false">
                <button class="icon-button secret-toggle" type="button" data-toggle-secret
                        aria-label="{{ secret_label }}" aria-controls="secret" aria-pressed="false">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                        <path class="eye-slash" d="m3 3 18 18" hidden/>
                    </svg>
                </button>
            </div>
        </div>
        <p id="resolve-error" class="feedback" role="alert" hidden></p>
        <div class="actions">
            <button class="button button-secondary" id="cancel-task" type="button">{{ ui.cancel_task }}</button>
            <button class="button" type="submit" id="submit-btn">{{ ui.save_to_vault }}</button>
        </div>
    </form>
</section>
<dialog id="cancel-modal" aria-labelledby="cancel-title">
    <h2 id="cancel-title">{{ ui.cancel_task_question }}</h2>
    <form id="cancel-form" class="form-stack">
        <p id="cancel-error" class="feedback" role="alert" hidden></p>
        <div class="actions">
            <button class="button button-secondary" type="button" data-close-dialog>{{ ui.close }}</button>
            <button class="button" type="submit">{{ ui.cancel_task }}</button>
        </div>
    </form>
</dialog>
{% endblock %}
