name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ANONYMIZED_TELEMETRY: "false"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      BOT_MODE: webhook
      TELEGRAM_BOT_TOKEN: ""
      VAULT_MASTER_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --no-sync pytest -q

  docker:
    name: Docker startup
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag wilco:ci .
      - name: Start application without external credentials
        run: |
          docker run --detach --name wilco-ci --init --shm-size=1g \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            --publish 127.0.0.1:8000:8000 \
            --env DATABASE_URL=sqlite+aiosqlite:////data/wilco.db \
            wilco:ci
          timeout 90 bash -c 'until curl --fail --silent http://127.0.0.1:8000/health; do sleep 2; done'
      - name: Verify headless Chromium starts as the application user
        run: |
          docker exec -i wilco-ci python - <<'PY'
          import asyncio
          from app.browser.context import create_browser

          async def main():
              browser = create_browser(keep_alive=False)
              try:
                  await browser.start()
              finally:
                  await browser.kill()

          asyncio.run(main())
          PY
      - name: Show container logs on failure
        if: failure()
        run: docker logs wilco-ci || true
      - name: Remove test container
        if: always()
        run: docker rm --force wilco-ci || true
